<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InventarioNR Pro — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #08090c;
    --surface:   #0f1117;
    --border:    #1e2230;
    --accent:    #4f8ef7;
    --accent2:   #7c5cf5;
    --text:      #e8eaf0;
    --muted:     #5a6080;
    --danger:    #f04a5a;
    --radius:    14px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: .4;
    pointer-events: none;
  }

  /* Glow blob */
  body::after {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(79,142,247,.12) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -60%);
    pointer-events: none;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 44px 40px;
    width: 420px;
    box-shadow: 0 40px 80px rgba(0,0,0,.5);
    animation: fadeUp .5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.3px;
  }

  .logo-text span { color: var(--accent); }

  h2 {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }

  label {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .6px;
  }

  input {
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,142,247,.15);
  }

  input::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .2s, transform .15s;
    letter-spacing: .3px;
  }

  .btn:hover { opacity: .9; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .error {
    background: rgba(240,74,90,.1);
    border: 1px solid rgba(240,74,90,.3);
    color: var(--danger);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 13.5px;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0 20px;
  }

  .hint {
    background: rgba(79,142,247,.07);
    border: 1px solid rgba(79,142,247,.15);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    display: flex; gap: 10px; align-items: flex-start;
  }

  .hint strong { color: var(--text); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">📦</div>
    <div class="logo-text">Inventario<span>NR</span> Pro</div>
  </div>

  <h2>Bienvenido</h2>
  <p class="subtitle">Inicia sesión para acceder al panel de control</p>

  {% if error %}
  <div class="error">⚠ {{ error }}</div>
  {% endif %}

  <form method="POST" autocomplete="off">
    <div class="field">
      <label>Usuario</label>
      <input name="usuario" placeholder="Tu usuario" autofocus required>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input name="password" type="password" placeholder="••••••••" required>
    </div>
    <button class="btn" type="submit">Ingresar al sistema →</button>
  </form>

  <hr class="divider">

  <div class="hint">
    <span>🔑</span>
    <div>Credenciales demo: <strong>admin</strong> / <strong>Admin2024!</strong></div>
  </div>
</div>
</body>
</html>
